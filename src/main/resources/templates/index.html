<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments::head(title='Pizza Luigi')}"></head>
<body>
<nav th:replace="~{fragments::navigation}"></nav>
<h1>Pizza Luigi</h1>
<img th:src="@{/images/luigi.jpg}" alt="Pizza Luigi" class="fullwidth">
<h2>Good <th:block th:text="${time}"></th:block></h2>
<h2>Owner</h2>
<dl th:object="${owner}">
    <dt>Name</dt>
    <dd th:text="*{name}"></dd>
    <dt>Number of kids</dt>
    <dd th:text="*{numberOfKids}"></dd>
    <dt>Married</dt>
    <dd th:text="*{married} ? 'Yes' : 'No'"></dd>
    <dt>Address</dt>
    <dd th:object="${owner.address}"
    th:text="|*{street} *{houseNumber} *{postalCode} *{city}|"></dd>
</dl>
</body>
</html>
